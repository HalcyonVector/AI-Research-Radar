name: Ingest Cron (free scheduler)

# -----------------------------------------------------------------------------
# On the Render FREE tier there is no always-on Celery beat. These scheduled
# GitHub Actions act as the "scheduler": they ping the API's internal admin
# endpoints so ingestion, rescoring, and Layer-3 intelligence actually run.
#
# Setup:
#   1. In the repo Settings -> Secrets and variables -> Actions, add:
#        API_BASE_URL   e.g. https://ai-research-radar-api.onrender.com
#        API_SECRET_KEY the same value as the backend SECRET_KEY / API auth key
#   2. Adjust the cron expressions below (times are UTC).
#
# CELERY_EAGER=true on the free tier means every /internal/* call below runs
# synchronously inside that one HTTP request — expect these to take a while
# (the weekly Layer-3 job especially). That's expected, not a bug.
#
# NOTE: this schedule (every 6h + weekly) is for driving the ingestion jobs,
# not for keeping the API warm for user traffic — it's far too infrequent for
# that (the free service sleeps after ~15 min idle). Warming for real visitors
# is handled separately by an external pinger (cron-job.org/UptimeRobot) hitting
# GET /health every ~10 min — see the README's "Free Cloud (Auto-Deploy)" section.
# -----------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours (UTC): ingest + enrich/rescoring
    - cron: "0 3 * * 1"      # weekly, Monday 03:00 UTC: full Layer-3 + briefing
  workflow_dispatch:          # allow manual runs
    inputs:
      crawl_job:
        description: >-
          One-shot deep-pull crawl instead of the regular ingest+enrich/weekly
          run (see manual-crawl job below). "unlock" force-clears the global
          job_lock if a crashed job left it stuck (check GET /internal/jobs/lock
          first). Leave as "none" for a normal manual run of the regular jobs.
        type: choice
        default: none
        options: [none, github, huggingface, both, unlock, arxiv]
      crawl_target:
        description: "Optional target override for the crawl (blank = each module's own default)"
        type: string
        default: ""

jobs:
  # Runs the 6-hourly ingest + enrich jobs ON THIS RUNNER, straight against
  # Supabase, instead of POSTing them to the Render API. The Render free
  # instance has 512MB shared between the web server and the job's child
  # process; the container OOM killer was SIGKILLing every job ~20s in, and
  # the endpoint still answered 200 "queued" (see utils/subjob.py), so for
  # weeks each run ingested a handful of rows and reported success. A runner
  # has ~7GB, and Actions minutes are free and unlimited for this public repo.
  #
  # Required repo secrets (Settings -> Secrets and variables -> Actions):
  #   DATABASE_URL    same value as on Render
  #   OPENAI_API_KEY  the Groq key Render uses (summaries)
  #   GEMINI_API_KEY  free key from aistudio.google.com (embeddings only;
  #                   Groq has no embeddings API)
  # Optional: REDIS_URL, HF_API_TOKEN, GH_API_TOKEN (falls back to this
  # workflow's own token), OPENAI_BASE_URL (defaults to Groq).
  # Optional repo variables: AI_MODE (default openai), GEMINI_MODEL,
  # OPENAI_MODEL_HEAVY, OPENAI_MODEL_LIGHT.
  ingest-and-enrich:
    if: github.event.schedule == '0 */6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.crawl_job == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: ingest-and-enrich
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .
      ENVIRONMENT: production
      CELERY_EAGER: "true"
      JOB_RSS_LIMIT_MB: "4000"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      AI_MODE: ${{ vars.AI_MODE || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # An unset secret expands to "", which would override the app's Groq default.
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.groq.com/openai/v1' }}
      OPENAI_MODEL_HEAVY: ${{ vars.OPENAI_MODEL_HEAVY || 'openai/gpt-oss-120b' }}
      OPENAI_MODEL_LIGHT: ${{ vars.OPENAI_MODEL_LIGHT || 'openai/gpt-oss-20b' }}
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_DIM: "384"
      HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          [ -n "${DATABASE_URL}" ] || { echo "::error::DATABASE_URL secret is not set (see the comment above this job)"; exit 1; }
          [ -n "${OPENAI_API_KEY}" ] || echo "::warning::OPENAI_API_KEY (Groq) not set - summaries will be skipped"
          [ -n "${GEMINI_API_KEY}" ] || echo "::warning::GEMINI_API_KEY not set - embeddings will be skipped"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # torch + sentence-transformers are only for EMBEDDING_PROVIDER=local;
      # skipping them saves ~1GB of download per run.
      - name: Install dependencies
        run: |
          grep -vE '^(--extra-index-url|torch|sentence-transformers)' requirements.txt > /tmp/requirements-jobs.txt
          pip install -r /tmp/requirements-jobs.txt

      - name: Run ingest + enrich jobs
        run: |
          failed=""
          run() {
            echo "::group::$1"
            rc=0
            timeout "${2:-1500}" python -m src.workers.run_job "$1" '{}' || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::$1 failed (exit ${rc}; 124 = timed out)"
              failed="${failed} $1"
            fi
          }
          run workers.ingestion.arxiv.run 2400
          run workers.ingestion.huggingface.run
          run workers.ingestion.github.run
          run workers.ai.backfill.run
          run workers.ingestion.semantic_scholar.run
          run workers.ingestion.openalex.run
          run workers.ingestion.social.run
          run workers.scoring.paper_scores.run_all
          run workers.scoring.trend_scores.run
          run workers.scoring.model_scores.run
          run workers.graph.edge_builder.rebuild
          run workers.intelligence.orchestrate.run_daily
          if [ -n "${failed}" ]; then echo "Failed:${failed}"; exit 1; fi

  weekly-intelligence-and-briefing:
    # Runs on this runner like ingest-and-enrich, not via the Render API. On
    # Render the first call outlived curl's 300s timeout while the job kept
    # going, and every later call (including the briefing) was refused with
    # 409 by the job lock, yet the workflow reported success; no briefing was
    # generated for weeks. DNA/breakthrough already run every 6h in
    # ingest-and-enrich (orchestrate.run_daily), so they are not repeated here.
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.crawl_job == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: .
      ENVIRONMENT: production
      CELERY_EAGER: "true"
      JOB_RSS_LIMIT_MB: "4000"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      AI_MODE: ${{ vars.AI_MODE || 'openai' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || 'https://api.groq.com/openai/v1' }}
      OPENAI_MODEL_HEAVY: ${{ vars.OPENAI_MODEL_HEAVY || 'openai/gpt-oss-120b' }}
      OPENAI_MODEL_LIGHT: ${{ vars.OPENAI_MODEL_LIGHT || 'openai/gpt-oss-20b' }}
      EMBEDDING_PROVIDER: gemini
      EMBEDDING_DIM: "384"
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          [ -n "${DATABASE_URL}" ] || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          [ -n "${OPENAI_API_KEY}" ] || echo "::warning::OPENAI_API_KEY (Groq) not set - the briefing will fail"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          grep -vE '^(--extra-index-url|torch|sentence-transformers)' requirements.txt > /tmp/requirements-jobs.txt
          pip install -r /tmp/requirements-jobs.txt

      - name: Run Layer-3 weekly jobs + briefing
        run: |
          failed=""
          run() {
            echo "::group::$1"
            rc=0
            timeout "${2:-1500}" python -m src.workers.run_job "$1" '{}' || rc=$?
            echo "::endgroup::"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::$1 failed (exit ${rc}; 124 = timed out)"
              failed="${failed} $1"
            fi
          }
          run workers.intelligence.propagation.build_idea_propagation_chains
          run workers.intelligence.genealogy.build_research_genealogy
          run workers.intelligence.cross_pollination.detect_cross_pollination
          run workers.intelligence.evolution.update_evolution_timelines
          run workers.intelligence.collaboration.detect_collaboration_clusters
          run workers.intelligence.frontier.train_and_score_frontier_predictor
          # Last, so it summarises this week's fresh Layer-3 output.
          run workers.ai.briefing.generate
          if [ -n "${failed}" ]; then echo "Failed:${failed}"; exit 1; fi

  # Manual-only: one-shot deep-pull crawl (see POST /internal/ingest/crawl/{job}'s
  # docstring). Never runs on the regular schedule -- only via workflow_dispatch
  # with crawl_job set to something other than "none". Deliberately excludes
  # itself from ingest-and-enrich/weekly-intelligence-and-briefing's own
  # workflow_dispatch runs (see their `if:` conditions) so a crawl doesn't
  # collide with those over the single global job_lock.
  manual-crawl:
    if: github.event_name == 'workflow_dispatch' && inputs.crawl_job != 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Warm the (possibly sleeping) free Render service
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 \
            "${API_BASE_URL}/health" || echo "health warmup failed (continuing)"

      - name: Check job lock
        if: inputs.crawl_job == 'unlock'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          curl -fsS -H "Authorization: Bearer ${API_SECRET_KEY}" "${API_BASE_URL}/api/v1/internal/jobs/lock"
          echo ""

      - name: Unlock
        if: inputs.crawl_job == 'unlock'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${API_SECRET_KEY}" \
            "${API_BASE_URL}/api/v1/internal/jobs/unlock"
          echo ""

      - name: Trigger arxiv only (isolated test path)
        if: inputs.crawl_job == 'arxiv'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: |
          # no -f: print the response body on 4xx/5xx too, so the real error is visible
          curl -sS --max-time 300 -X POST -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer ${API_SECRET_KEY}" \
            "${API_BASE_URL}/api/v1/internal/ingest/trigger/arxiv" || echo "arxiv failed/timed out"

      - name: Crawl
        if: inputs.crawl_job != 'unlock' && inputs.crawl_job != 'arxiv'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          CRAWL_JOB: ${{ inputs.crawl_job }}
          CRAWL_TARGET: ${{ inputs.crawl_target }}
        run: |
          jobs="${CRAWL_JOB}"
          [ "${CRAWL_JOB}" = "both" ] && jobs="github huggingface"
          for job in ${jobs}; do
            echo "--- crawl: ${job} ---"
            url="${API_BASE_URL}/api/v1/internal/ingest/crawl/${job}"
            [ -n "${CRAWL_TARGET}" ] && url="${url}?target=${CRAWL_TARGET}"
            # Deep crawls paginate a lot (esp. huggingface's default target of
            # 25000) -- give this the same generous budget as the weekly
            # Layer-3 jobs rather than the lighter ingest timeouts.
            curl -fsS --max-time 1800 -X POST \
              -H "Authorization: Bearer ${API_SECRET_KEY}" \
              "${url}" \
              && echo "" && echo "${job} crawl triggered" || echo "${job} crawl failed/timed out (safe to retry)"
          done
